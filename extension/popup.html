<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sentinel Scam Shield</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      color: #0f172a;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    h2 {
      font-size: 12px;
      margin: 16px 0 8px;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      margin-top: 2px;
    }
    .field {
      flex-direction: column;
      gap: 4px;
      margin-top: 14px;
      font-weight: 600;
    }
    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 400;
    }
    p {
      font-size: 11px;
      color: #64748b;
      margin: 8px 0 0;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #0f172a;
      color: #ffffff;
    }
    button.upgrade {
      background: #ea580c;
    }
    button.linklike {
      background: none;
      color: #64748b;
      font-weight: 400;
      text-decoration: underline;
      padding: 2px 0;
      margin-top: 6px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.pro {
      background: #ffedd5;
      color: #c2410c;
    }
    .badge.free {
      background: #e2e8f0;
      color: #475569;
    }
    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      margin-top: 4px;
    }
    .account-email {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .error {
      color: #dc2626;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Sentinel Scam Shield</h1>

  <h2>Account</h2>
  <div id="signed-out">
    <label class="field hidden" id="name-field">
      <span>Full name</span>
      <input type="text" id="signup-name" autocomplete="name" />
    </label>
    <label class="field hidden" id="birth-year-field">
      <span>Birth year</span>
      <input type="number" id="signup-birth-year" min="1900" autocomplete="bday-year" />
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" id="login-email" autocomplete="username" />
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" id="login-password" autocomplete="current-password" />
    </label>
    <button id="login-button">Sign in</button>
    <p id="login-status"></p>
    <button id="mode-toggle" class="linklike">New here? Create account</button>
  </div>
  <div id="signed-in" class="hidden">
    <div class="account-row">
      <span class="account-email" id="account-email"></span>
      <span class="badge free" id="plan-badge">Free</span>
    </div>
    <button id="upgrade-button" class="upgrade">Upgrade to Pro — RM9.90/month</button>
    <p id="billing-status"></p>
    <button id="signout-button" class="linklike">Sign out</button>
  </div>

  <h2>Settings</h2>
  <label>
    <input type="checkbox" id="use-site-adapters" />
    <span>Use site-specific adapters</span>
  </label>
  <p>
    Off = every site uses the generic review-page reader, including sites that
    have a hand-written adapter. Use this to test generic coverage.
  </p>
  <label class="field">
    <span>Screening backend</span>
    <input type="url" id="api-base" placeholder="https://next-hack2026.vercel.app" />
  </label>
  <p id="api-base-status"></p>
  <script src="popup.js"></script>
</body>
</html>
